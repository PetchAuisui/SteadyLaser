name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays: catches a new runner image or Xcode breaking the build
    # between pushes.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its run; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Also checks the shell scripts in the workflow's steps with shellcheck.
      - name: Workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # One toolchain failing shouldn't hide how the others did.
      fail-fast: false
      matrix:
        include:
          # The oldest macOS and Xcode (16) GitHub still runs. The app
          # supports macOS 14 and later.
          - name: macOS 15, Apple silicon
            runner: macos-15
          # Intel Macs run macOS 15 too.
          - name: macOS 15, Intel
            runner: macos-15-intel
          # macos-latest. The app download comes from here.
          - name: macOS 26
            runner: macos-26
            publish: true
          # The newest Xcode, the one the app is developed with. Also checks
          # the code against Swift 6's complete concurrency rules.
          - name: Xcode 27
            runner: xcode-27
            strict: true
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Script and Info.plist syntax
        run: |
          zsh -n build.sh
          plutil -lint Resources/Info.plist

      - name: Build (debug, warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Swift 6 concurrency checks
        if: matrix.strict
        run: swift build --build-tests -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete

      - name: Unit tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build (release, warnings are errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Filter self-test
        run: .build/release/SteadyLaser --selftest

      - name: Build app bundle
        run: ./build.sh

      - name: Check app bundle
        run: |
          APP="build/Steady Laser.app"
          PLIST="$APP/Contents/Info.plist"
          info() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }
          plutil -lint "$PLIST"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for key in CFBundleIdentifier CFBundleExecutable CFBundleName CFBundleShortVersionString \
                     CFBundleVersion CFBundleIconFile LSMinimumSystemVersion LSUIElement; do
            info "$key" >/dev/null || { echo "::error file=Resources/Info.plist::Info.plist has no $key"; exit 1; }
          done
          EXE="$APP/Contents/MacOS/$(info CFBundleExecutable)"
          [ -x "$EXE" ] || { echo "::error::$EXE is missing or not executable"; exit 1; }
          [ -s "$APP/Contents/Resources/$(info CFBundleIconFile).icns" ] || { echo "::error::The app icon is missing"; exit 1; }
          # The binary mustn't need a newer macOS than the bundle promises:
          # Package.swift's platform and Info.plist have to agree.
          promised=$(info LSMinimumSystemVersion)
          needed=$(vtool -show-build "$EXE" | awk '$1 == "minos" { print $2; exit }')
          echo "Info.plist promises macOS $promised; the binary needs macOS $needed"
          [ "$needed" = "$promised" ] || {
            echo "::error file=Resources/Info.plist::The binary needs macOS $needed but Info.plist says $promised. Keep Package.swift and Info.plist in step."
            exit 1
          }

      - name: Launch the app
        run: |
          APP="build/Steady Laser.app"
          defaults write local.steadylaser debugLog -bool true
          "$APP/Contents/MacOS/SteadyLaser" > launch.log 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0
            wait "$pid" || status=$?
            echo "::error::The app quit within 10 seconds of launching (exit status $status)"
            cat launch.log
            cat ~/Library/Logs/DiagnosticReports/SteadyLaser* 2>/dev/null || true
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "Still running after 10 seconds. Its log:"
          cat ~/Library/Logs/SteadyLaser.log 2>/dev/null || echo "(nothing logged)"

      - name: Render snapshots
        run: |
          APP="build/Steady Laser.app/Contents/MacOS/SteadyLaser"
          mkdir -p snapshots
          "$APP" --snapshot snapshots/styles.png
          "$APP" --snapshot-spotlight snapshots/spotlight.png
          "$APP" --snapshot-capture snapshots/capture-panel.png
          "$APP" --snapshot-settings snapshots/settings.png
          for f in styles spotlight capture-panel settings; do
            [ "$(file -b --mime-type "snapshots/$f.png")" = image/png ] \
              || { echo "::error::snapshots/$f.png is missing or not a PNG"; exit 1; }
          done

      # Fonts and controls draw a little differently on each macOS, so each
      # runner keeps its own set.
      - name: Upload snapshots
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ matrix.runner }}
          path: snapshots/
          retention-days: 14

      - name: Zip app
        if: matrix.publish
        run: ditto -c -k --keepParent "build/Steady Laser.app" "SteadyLaser.zip"

      - name: Upload app
        if: matrix.publish
        uses: actions/upload-artifact@v7
        with:
          name: SteadyLaser-app
          path: SteadyLaser.zip
          retention-days: 14

  sanitizers-and-coverage:
    name: Sanitizers and coverage
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Memory errors (use after free, overflows), data races, and undefined
      # behaviour that the tests trip over without failing. Each runs even if
      # the one before it failed.
      - name: Unit tests, address sanitizer
        run: swift test --sanitize=address

      - name: Unit tests, thread sanitizer
        if: success() || failure()
        run: swift test --sanitize=thread

      - name: Unit tests, undefined behaviour sanitizer
        if: success() || failure()
        run: swift test --sanitize=undefined

      - name: Unit tests with coverage
        if: success() || failure()
        run: swift test --enable-code-coverage

      - name: Coverage report
        if: success() || failure()
        run: |
          BIN=$(swift build --show-bin-path)
          XCTEST=$(find "$BIN" -maxdepth 1 -name '*.xctest' | head -1)
          EXE="$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)"
          PROFILE="$BIN/codecov/default.profdata"
          IGNORE='(\.build|Tests)/'
          xcrun llvm-cov report "$EXE" -instr-profile "$PROFILE" -ignore-filename-regex="$IGNORE" | tee coverage.txt
          xcrun llvm-cov export "$EXE" -instr-profile "$PROFILE" -ignore-filename-regex="$IGNORE" -format=lcov > coverage.lcov
          {
            echo "### Unit test coverage"
            echo
            echo "Lines of app code the unit tests run. The menu, windows and layers are checked by launching the app and rendering snapshots instead."
            echo
            echo "| File | Lines | Covered |"
            echo "|---|---:|---:|"
            awk 'NR > 2 && $1 !~ /^-+$/ { printf "| %s | %s | %s |\n", $1, $8, $10 }' coverage.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.txt
            coverage.lcov
          retention-days: 14
