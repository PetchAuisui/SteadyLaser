name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, package
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests
        run: swift test

      - name: Filter self-test
        run: .build/release/SteadyLaser --selftest

      - name: Build app bundle
        run: ./build.sh

      - name: Render snapshots
        run: |
          APP="build/Steady Laser.app/Contents/MacOS/SteadyLaser"
          mkdir -p snapshots
          "$APP" --snapshot snapshots/styles.png
          "$APP" --snapshot-spotlight snapshots/spotlight.png
          "$APP" --snapshot-capture snapshots/capture-panel.png
          for f in styles spotlight capture-panel; do
            test -s "snapshots/$f.png" || { echo "::error::snapshots/$f.png was not written"; exit 1; }
          done

      - name: Zip app
        run: ditto -c -k --keepParent "build/Steady Laser.app" "SteadyLaser.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SteadyLaser-app
          path: SteadyLaser.zip
          retention-days: 14

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/
          retention-days: 14
